# ============================================================

version: "3.9"

services:
  geointel-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geointel-core
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist vector database across container restarts
      - chroma_data:/app/backend/storage/chroma
      # Persist uploaded and scraped PDF documents
      - pdf_storage:/app/backend/storage/pdfs
      # Persist generated reports
      - reports_storage:/app/backend/storage/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  chroma_data:
    driver: local
  pdf_storage:
    driver: local
  reports_storage:
    driver: local
